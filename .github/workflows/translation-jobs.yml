# Publishes the translation job board for Lumenary Every Nation (docs/i18n/every-nation.md):
# whenever English content lands on main, jobs.json on the `translation-jobs` branch is regenerated,
# and volunteers' every-nation tools pick the new jobs up on their next run.
name: translation-jobs

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "src/i18n/messages/**"
      - "src/i18n/config.ts"
      - "scripts/translation-jobs.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translation-jobs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the job board
        run: node scripts/translation-jobs.mjs --out "$RUNNER_TEMP/jobs.json"
      - name: Publish it on the translation-jobs branch
        run: |
          git config user.name "lumenary-translation-jobs"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dir="$RUNNER_TEMP/board"
          if git ls-remote --exit-code --heads origin translation-jobs >/dev/null; then
            git fetch --depth 1 origin translation-jobs
            git worktree add "$dir" FETCH_HEAD
            git -C "$dir" checkout -B translation-jobs
          else
            git worktree add --detach "$dir"
            git -C "$dir" checkout --orphan translation-jobs
            git -C "$dir" rm -rfq .
          fi
          cp "$RUNNER_TEMP/jobs.json" "$dir/jobs.json"
          printf '%s\n' "# Translation job board" "" "Generated from main by .github/workflows/translation-jobs.yml. Do not edit by hand; see docs/i18n/every-nation.md on main." > "$dir/README.md"
          git -C "$dir" add jobs.json README.md
          if git -C "$dir" diff --cached --quiet; then echo "no change"; exit 0; fi
          git -C "$dir" commit -qm "jobs: ${GITHUB_SHA::7}"
          git -C "$dir" push origin translation-jobs
