# Lumenary Every Nation (docs/i18n/every-nation.md): a pull request that changes translations is
# routed to the language experts listed in lumenary-every-nation's experts.json, who review it.
# Runs on pull_request_target so it can comment on pull requests from forks; it never checks out or
# runs the pull request's code, and treats file names and the experts list as data.
name: translation-review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  route:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = "<!-- every-nation-review -->";
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
            const patterns = [
              /^content\/math\/(?:lessons|trails)\/[^/]+\/([A-Za-z]{2,3}(?:-[A-Za-z]{2,8})?)\.mdx$/,
              /^content\/math\/lessons\/[^/]+\/exercises\.([A-Za-z]{2,3}(?:-[A-Za-z]{2,8})?)\.json$/,
              /\/lesson\.([A-Za-z]{2,3}(?:-[A-Za-z]{2,8})?)\.mdx$/,
              /\/exercises\.([A-Za-z]{2,3}(?:-[A-Za-z]{2,8})?)\.json$/,
              /\/course\.([A-Za-z]{2,3}(?:-[A-Za-z]{2,8})?)\.json$/,
              /^content\/pages\/[^/]+\/([A-Za-z]{2,3}(?:-[A-Za-z]{2,8})?)\.mdx$/,
              /^src\/i18n\/messages\/([A-Za-z]{2,3}(?:-[A-Za-z]{2,8})?)\.json$/,
              /^content\/registry\/glossaries\/([A-Za-z]{2,3}(?:-[A-Za-z]{2,8})?)\.json$/,
            ];
            const locales = new Set();
            for (const f of files) for (const re of patterns) { const m = f.filename.match(re); if (m && m[1] !== "en") locales.add(m[1]); }
            if (!locales.size) return;
            let experts = {};
            try {
              const res = await fetch("https://raw.githubusercontent.com/lumenary-academy/lumenary-every-nation/main/experts.json");
              if (res.ok) experts = (await res.json()).languages ?? {};
            } catch (e) { core.warning(`could not read experts.json: ${e}`); }
            const handle = /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$/;
            const lines = [...locales].sort().map((l) => {
              const people = (experts[l]?.experts ?? []).map((x) => x.github).filter((h) => typeof h === "string" && handle.test(h));
              return people.length ? `- **${l}**: ${people.map((h) => `@${h}`).join(" ")}` : `- **${l}**: no language expert yet. Speak ${l} well? [Apply to be one](https://github.com/lumenary-academy/lumenary-every-nation/issues/new?template=expert-application.yml).`;
            });
            const body = `${MARKER}\nThis pull request changes translations. Language experts, please review it against the English original (see [the translation workflow](https://github.com/${owner}/${repo}/blob/main/docs/i18n/translation-workflow.md)); only a named expert's review can raise a translation's status above \`machine-draft\`.\n\n${lines.join("\n")}`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull_number, per_page: 100 });
            const mine = comments.find((c) => c.body?.includes(MARKER));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
